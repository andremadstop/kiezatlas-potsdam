# Richtwerte und Annahmen der Planer-Ebene (Kiezatlas Potsdam, Ausbau A).
# Angelegt von P0 (05.11.2026) mit allen bis dahin bekannten Einträgen (Prüfbericht, Korrektur 19).
# Eigentümer: A6 (skripte/15_planer.py liest die Datei). Ausnahme: Den Abschnitt `oepnv` pflegt nur A4,
# zwischen den Markern „A4 Anfang“ und „A4 Ende“; A6 ändert dort nichts. Kein Wert im Code.
#
# Felder je Wert:
#   wert/werte  Zahl oder Liste (Einheit in `einheit`); null = noch nicht aus der Quelle gelesen
#   status      amtlich (Potsdamer bzw. Brandenburger Norm mit Beleg) | orientierung (ohne Primärbeleg,
#               in der Seite als „Orientierung, kein Richtwert“) | berliner_methode | offen
#   quelle      Dokument; seite = Fundstelle; geprueft = Datum, an dem jemand die Fundstelle gelesen hat
#   methode     luftlinie | fussweg | flaeche | quote
# Offene Punkte (Prüfbericht 11, 28): Aktualität von NVP, EHK und Satzung ist ungeprüft; Werte mit
# geprueft: null stammen aus der Erkundung und müssen vor der Veröffentlichung an der Quelle bestätigt werden.

stand: 2026-11-05

geheimhaltung:
  # Korrektur 15 und Bauplan A6: feine Zensusklassen nur je Raumeinheit mit mindestens so vielen Einwohnern
  min_ew_raumeinheit: 100
  rundung_ew: 10              # Einwohnerzahlen in planer.js auf 10 runden
  rundung_anteil_prozent: 1   # Anteile ganzzahlig
  unsicherheit: "Zensus 2022 mit Cell-Key-Verfahren: kleine Werte sind verändert, Summen vieler Zellen weichen ab. Stichtag 15.05.2022."

stichtage:
  zensus: 2022-05-15
  mbjs_kita_schule: 2026-11-05   # Abruf; Schülerzahlen tragen eigenen Stand (z. B. „Stand: 2022“)
  alkis_nutzung: 2026-11-05
  neubau_hinweis: "Neubaugebiete nach dem 15.05.2022 fehlen in den Zensuszahlen, u. a. Krampnitz, Bornstedter Feld, Golm."

raumebene:
  bevorzugt: planungsraum      # sobald H1 geladen ist (public.planungsraum), Korrektur 2
  ersatz: stadtteil            # bis dahin die 32 amtlichen Stadtteile

# ---------------------------------------------------------------------------------- ÖPNV
# A4 Anfang
oepnv:
  # Gelesen am 05.11.2026 im NVP 2019 (PDF, sha256 3e9a83e1…, $KIEZ_DATEN/nvp_potsdam/2019/), Protokoll: pruefen/a4_nvp_lesung.md.
  # Seitenzahlen = Druckseiten des NVP. Der NVP misst in Luftlinie.
  quelle: "Nahverkehrsplan 2019 für die Landeshauptstadt Potsdam (VerkehrsConsult Dresden-Berlin), Kap. 4.1.1–4.1.3, Anlage 4"
  url: https://www.potsdam.de/system/files/documents/2020-09-29_nvp_potsdam_mit_anlagen.pdf
  geprueft: 2026-11-05
  methode: luftlinie
  aktualitaet:
    gilt_fuer: "2019 bis 2023 (Kap. 4.1, S. 54)"
    befund: "formal abgelaufen; Nachfolger in zwei Websuchen am 05.11.2026 nicht gefunden, bei der Stadt nicht nachgefragt"
    status: offen
  # Kernbefund (Prüfbericht Korrektur 11): Die Klasse I/II/III ist eine Eigenschaft des Ortsteils (Nutzungsdichte,
  # Tab. 4.1), nicht der Haltestelle. Einzugsradius und Soll-Takt folgen aus der Ortsteilklasse.
  einzugsradius_m:
    seite: "Tab. 4.2, S. 59"
    status: amtlich
    # Schlüssel: Verkehrsmittel → Ortsteilklasse (gebietsklasse), nicht Taktklasse
    tram: {I: 350, II: 450, III: null}
    bus: {I: 300, II: 400, III: 500}
    spnv: {I: null, II: null, III: null, hinweis: "Tab. 4.2 nennt keinen Wert; Abb. 4.2 (S. 61) zeichnet SPNV ohne Radiusangabe. Nicht erfinden; A5 kennzeichnet SPNV getrennt."}
    faehre: {I: null, II: null, III: null, hinweis: "nicht in Tab. 4.2"}
  erschliessung:
    seite: "Kap. 4.1.3, S. 58"
    status: amtlich
    teilflaeche_min_ew: 200        # Teilflächen mit mehr als 200 EW sollen erschlossen sein
    anteil_ew_prozent: 80          # erschlossen, wenn 80 % der EW im Einzugsbereich liegen
    hinweis: "„Teilfläche“ ist im NVP nicht als Geometrie definiert; Abb. 4.2 bewertet auf Ortsteilen. A6 rechnet auf Planungsraum bzw. Stadtteil und benennt die Abweichung."
  taktklassen:
    # Tab. 4.3, S. 59: Soll-Fahrten je Stunde und Richtung in der HVZ, je Ortsteilklasse. A4 leitet daraus eine
    # Taktklasse je Haltestelle ab (erreichter Takt gemessen an den Untergrenzen). Das ist eine eigene Lesart:
    # Werte zwischen 3 und 6 Fahrten zählt der NVP keiner Klasse zu, hier gelten sie als II.
    seite: "Tab. 4.3, S. 59"
    status: amtlich
    eigene_festlegung: "Zuordnung nach Untergrenzen; > 3 und < 6 Fahrten = II; unter 1 Fahrt = „unter III“"
    I: {fahrten_hvz_je_richtung_min: 6, soll_hvz: "6 bis 12"}
    II: {fahrten_hvz_je_richtung_min: 2, soll_hvz: "2 bis 3"}
    III: {fahrten_hvz_je_richtung_min: 1, soll_hvz: "1"}
  messung:
    # Wie 13_oepnv.py den Takt misst (eigene Festlegung, im Lese-Protokoll begründet)
    stichtag: 2026-11-10        # Dienstag, Schultag (Herbstferien Brandenburg 19.–30.10.2026)
    stichtag_art: Schultag      # Text an den ÖPNV-Werten (15_planer.py, Audit K32)
    # Erster Gültigkeitstag des Fahrplans: calendar.txt im GTFS-Zip ($KIEZ_DATEN/vbb_gtfs/2026-11-05/GTFS.zip),
    # start_date 20261103 bei allen 3.185 service_id (geprüft 06.11.2026); HERKUNFT.md: „Fahrplan gültig ab 03.11.2026“
    fahrplan_gueltig_ab: 2026-11-03
    hvz_fenster: ["06:00", "09:00"]   # morgendliche HVZ Mo–Fr Klasse I und II (Abb. 4.1, S. 57); Mittel je Stunde
    hvz_fenster_nvp_anlage4: {I: ["06:00", "08:00"], II: ["07:00", "09:00"], III: ["07:00", "09:00"]}
    richtung: "Abfahrten (pickup_type ≠ 1, ohne Endhalt der Fahrt), alle Linien zusammen, je direction_id gezählt; Wert = größere der beiden Richtungen"
    randpuffer_m: 1000          # Haltestellen bis 1 km außerhalb der Stadtgrenze (Brandenburg, E7), Berlin nicht
  gebietsklassen:
    # Tab. 4.1, S. 55–56, wörtlich (NVP-Ortsteile). we = Klasse am Wochenende.
    nvp_ortsteile:
      I: [Bornstedter Feld, Golm Ost, Golm West, Brandenburger Vorstadt, Potsdam West, Nördliche Innenstadt,
          Südliche Innenstadt, Babelsberg Süd, Babelsberg Zentrum, Teltower Vorstadt, Schlaatz, Waldstadt II,
          Am Stern, Drewitz, Kirchsteigfeld]
      II: [Bornim, Bornstedter Ortslage, Eiche, Jägervorstadt, Berliner Vorstadt, Babelsberg Nord, Templiner Vorstadt,
           Hermannswerder, Waldstadt I, Industriegelände, Fahrland, Kaserne Krampnitz, Neu Fahrland, Groß Glienicke,
           Campus Jungfernsee]
      III: [Institut Bornim, Nedlitz, Sacrow, Grube, Nauener Vorstadt, Forststraße, Klein Glienicke, Alt Drewitz,
            Uetz-Paaren, Marquardt, Friedrichspark, Satzkorn, Kartzow, Krampnitz Ort, Waldsiedlung Groß Glienicke,
            Das kurze Feld]
      ohne_klasse: [Forst Potsdam Süd, Wildpark]
      we: {Bornstedter Feld: II, Babelsberg Süd: II, Am Stern: II, Golm Ost: III, Golm West: III, Industriegelände: III}
    widerspruch: "Waldstadt I steht in Tab. 4.1 unter Klasse II, im Text S. 56 im Klasse-I-Korridor und in Anlage 4 unter Klasse I."
    # Nachlauf N2 (05.11.2026): NVP-Ortsteil und Gebietsklasse je statistischem Bezirk für die 9 Stadtteile, die
    # nach Namen gemischt oder offen waren. Geometrie: $KIEZ_DATEN/eingang/statistische-bezirke-in-potsdam.geojson
    # (LHP, Stand 31.12.2021, dl-de/by-2-0, sha256 e5949434…), nur intern gerechnet; keine Bezirksgeometrie in daten/.
    # Die daraus abgeleitete Stadtteilklasse (43, 44) geht über 15_planer.py (A6) in daten/planer.js ein und braucht
    # dort den Vermerk „Statistische Bezirke © LHP, dl-de/by-2-0, Daten verändert“ (A6 und QUELLEN.md, nicht N2).
    # Der NVP hat keine Karte der Ortsteilgrenzen als Datei; Anlage 2 listet die Einwohner je statistischem Bezirk
    # (Nummern von 2017). Die ersten zwei Ziffern der Bezirksnummer bilden die Ortsteilgruppe; Tab. 4.1 teilt einige
    # Gruppen weiter (z. B. 13 in Bornstedter Feld, Bornstedter Ortslage, Das kurze Feld).
    # Umnummerierung 2017 → 2021 (nach Namen): 330 Wildpark → 324, 421 Brauhausberg Nord → 441, 422 Hauptbahnhof → 442,
    # 423 Zentrum Ost → 431 (+ 432 Nuthepark), 660 Industriegelände → 644, 670 Forst Potsdam Süd → 613,
    # 841 Fahrland Ortslage → 844, 842 Krampnitz → 845 (dazu neu 842 Krampnitz Ortslage).
    # grundlage: name = Bezirksname gleich NVP-Ortsteil; anker = Haltestellen, die der NVP (Anlage 3/4) unter diesem
    #   Ortsteil bzw. dieser Klasse führt, liegen im Bezirk (Gegenprobe pruefen/a4_gebietsklassen.py); nummer = Ortsteil
    #   aus der Nummerngruppe der Anlage 2; ausschluss = einziger übrig bleibender Ortsteil der Gruppe.
    # klasse null + moeglich = nicht eindeutig (Widerspruch im NVP oder zwei Ortsteile in einem Bezirk).
    statistische_bezirke:
      "111": {name: Bornim Nord, nvp: Institut Bornim, klasse: III, grundlage: anker, anker: [Institut für Agrartechnik],
              hinweis: "Namensschluss: Haltestelle Institut für Agrartechnik liegt im Bezirk; NVP nennt keine Haltestelle für Institut Bornim"}
      "112": {name: Bornim Ortslage, nvp: Bornim, klasse: II, grundlage: name, anker: [Kirche Bornim]}
      "113": {name: Katharinenholz, nvp: Bornim, klasse: II, grundlage: ausschluss,
              hinweis: "kein Anker; Gruppe 11 kennt nur Bornim und Institut Bornim"}
      "114": {name: Schlangenbruch, nvp: Institut Bornim, klasse: III, grundlage: anker, anker: [Heineberg, Sacrow-Paretzer Kanal],
              hinweis: "Anlage 3 und 4 führen beide Haltestellen in der Tabelle Klasse III (Zeilenkopf „Bornim“); in Tab. 4.1 ist im Raum Bornim nur Institut Bornim Klasse III"}
      "131": {name: Das Kurze Feld, nvp: Das kurze Feld, klasse: III, grundlage: name}
      "132": {name: Bornstedter Feld, nvp: Bornstedter Feld, klasse: I, grundlage: name}
      "133": {name: Bornstedter Ortslage, nvp: Bornstedter Ortslage, klasse: II, grundlage: name}
      "321": {name: Potsdam West Zentrum, nvp: Potsdam West, klasse: I, grundlage: name}
      "322": {name: Luftschiffhafen, nvp: Potsdam West, klasse: I, grundlage: ausschluss,
              hinweis: "Gruppe 32 (Anlage 2: 321–323) ohne eigenen NVP-Ortsteil Luftschiffhafen"}
      "323": {name: Forststraße, nvp: Forststraße, klasse: III, grundlage: name}
      "324": {name: Wildpark, nvp: Wildpark, klasse: null, grundlage: name, hinweis: "Tab. 4.1: keiner Klasse zugeordnet (2017: Bezirk 330)"}
      "431": {name: Zentrum Ost, nvp: Südliche Innenstadt, klasse: I, grundlage: nummer,
              hinweis: "2017 Bezirk 423 in Gruppe 42 (Südliche Innenstadt)"}
      "432": {name: Nuthepark, nvp: Südliche Innenstadt, klasse: I, grundlage: nummer,
              hinweis: "2021 aus Zentrum Ost (2017: 423) herausgelöst"}
      "441": {name: Brauhausberg Nord, nvp: Südliche Innenstadt, klasse: I, grundlage: nummer, anker: [Am Havelblick],
              hinweis: "2017 Bezirk 421; Anlage 4 führt Am Havelblick unter Klasse I (Zeile Teltower Vorstadt, ebenfalls I)"}
      "442": {name: Hauptbahnhof, nvp: Südliche Innenstadt, klasse: I, grundlage: nummer, anker: [Schlaatzstr.],
              hinweis: "2017 Bezirk 422; Anlage 4 führt Schlaatzstr. unter Klasse I (Zeile Teltower Vorstadt, ebenfalls I)"}
      "641": {name: Waldstadt I Nord, nvp: Waldstadt I, klasse: null, moeglich: [I, II], grundlage: anker,
              anker: [Unter den Eichen, Drewitzer Str./Erich-Weinert-Str.], hinweis: "Anlage 3/4 bewerten diese Haltestellen als Klasse I; Tab. 4.1 sagt II"}
      "642": {name: Stadtrandsiedlung, nvp: Waldstadt I, klasse: null, moeglich: [I, II], grundlage: anker, anker: [Am Fenn]}
      "643": {name: Waldstadt I Süd, nvp: Waldstadt I, klasse: null, moeglich: [I, II], grundlage: name}
      "644": {name: Industriegelände, nvp: Industriegelände, klasse: II, grundlage: name, hinweis: "2017 Bezirk 660"}
      "721": {name: Drewitz Ortslage, nvp: Alt Drewitz, klasse: III, grundlage: name, anker: [Drewitz-Ort],
              hinweis: "Namensschluss: Ortslage = alter Ortskern (Alt Drewitz), Haltestelle Drewitz-Ort; NVP nennt keine Haltestelle für Alt Drewitz"}
      "722": {name: Gewerbegebiet Drewitz, nvp: Drewitz, klasse: I, grundlage: ausschluss}
      "723": {name: Drewitz I, nvp: Drewitz, klasse: I, grundlage: name}
      "724": {name: Drewitz II, nvp: Drewitz, klasse: I, grundlage: name}
      "725": {name: Drewitzer Nuthewiesen, nvp: Drewitz, klasse: I, grundlage: ausschluss, hinweis: "2021 neu"}
      "842": {name: Krampnitz Ortslage, nvp: Krampnitz Ort, klasse: III, grundlage: anker, anker: [Rotkehlchenweg],
              hinweis: "Anlage 3, Klasse III, Zeile Krampnitz Ort"}
      "843": {name: Kartzow, nvp: Kartzow, klasse: III, grundlage: name}
      "844": {name: Fahrland Ortslage, nvp: Fahrland, klasse: II, grundlage: anker,
              anker: [An der Windmühle, Schule Fahrland, Kaiserplatz, Kienhorststr., Am Upstall, Eisbergstücke],
              hinweis: "Anlage 4, Klasse II, Zeile Fahrland; 2017 Bezirk 841"}
      "845": {name: Krampnitz, nvp: Kaserne Krampnitz, klasse: II, grundlage: anker, anker: [Fahrländer See],
              hinweis: "Anlage 4, Klasse II, Zeile Krampnitz Kaserne; 2017 Bezirk 842"}
      "860": {name: Groß Glienicke, nvp: [Groß Glienicke, Waldsiedlung Groß Glienicke], klasse: null, moeglich: [II, III],
              grundlage: anker, anker: [Theodor-Fontane-Str., Landesumweltamt, Waldsiedlung Groß Glienicke],
              hinweis: "ein Bezirk, zwei NVP-Ortsteile: Theodor-Fontane-Str. (Anlage 4, Klasse II) und Landesumweltamt, Waldsiedlung (Anlage 3, Klasse III) liegen beide darin; ohne feinere Grenze nicht trennbar"}
    # Abbildung auf die 32 Stadtteile (public.stadtteil.nr). Die 9 Stadtteile mit `bezirke_geprueft` sind seit N2 über
    # die statistischen Bezirke oben bestimmt: klasse gesetzt nur, wenn alle bewohnten Bezirke (Zensus 2022) dieselbe
    # Klasse haben; sonst bleibt klasse null, anteil_ew_prozent zeigt die Einwohneranteile je Klasse (a4_gebietsklassen.py).
    # zuordnung: eindeutig = gleichnamig; zusammengesetzt = alle Bestandteile gleiche Klasse (Bestandteile aus dem Namen
    # abgeleitet); bezirke = über die statistischen Bezirke bestimmt; gemischt = Bestandteile mit verschiedenen Klassen;
    # offen = kein gleichnamiger Eintrag.
    stadtteile:
      "11": {klasse: null, zuordnung: gemischt, teile: {Bornim: II, Institut Bornim: III}, bezirke_geprueft: 2026-11-05, anteil_ew_prozent: {II: 83, III: 17}}
